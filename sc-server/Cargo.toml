[package]
name = "sc-server"
version = "0.12.3"
edition = "2024"
description = "Sprite Cloud server — in-process game streaming with GStreamer + WebRTC"
license = "AGPL-3.0-or-later"

[lib]
name = "sc_server"
path = "src/lib.rs"

[[bin]]
name = "sc-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = "2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
time = { version = "0.3", features = ["formatting"] }
dirs = "6"
sha2 = "0.10"
sha1 = "0.10"
crc = "3"
hex = "0.4"
anyhow = "1"
url = "2"
if-addrs = "0.8"
libc = "0.2"
libretro-runner = { path = "../libretro-runner" }
sc-core = { path = "../sc-core" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "time"] }
walkdir = "2"
axum = "0.7"
webrtc = { version = "0.17", features = ["pem"] }
tokio-util = "0.7"
gstreamer = "0.23"
gstreamer-app = "0.23"
stun = "=0.17.1"
shellexpand = "3.1.2"
thiserror = "2"
async-trait = "0.1"
quick-xml = { version = "0.37", default-features = false, features = ["encoding"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
filetime = "0.2"
