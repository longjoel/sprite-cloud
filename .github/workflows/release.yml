name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-x86_64:
    name: Build sc-server (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            libglib2.0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build sc-server and sc-core
        run: cargo build --release -p sc-server -p sc-core

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: x86_64
          path: |
            target/release/sc-server
            target/release/sc-core

  build-aarch64:
    name: Build sc-server (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            libglib2.0-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build sc-server and sc-core
        run: cargo build --release -p sc-server -p sc-core

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: aarch64
          path: |
            target/release/sc-server
            target/release/sc-core

  create-release:
    name: Create GitHub Release
    needs: [build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize and checksum artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for arch in x86_64 aarch64; do
            test -f "artifacts/$arch/sc-server"
            test -f "artifacts/$arch/sc-core"
            for binary in sc-server sc-core; do
              cp "artifacts/$arch/$binary" "release-assets/$binary-$arch"
              (cd release-assets && sha256sum "$binary-$arch" > "$binary-$arch.sha256")
            done
          done

          # Non-secret release identity manifest: version, git SHA, and
          # artifact checksums so an incident can correlate release → binary
          # (#661 scope item 4). Package versions come from Cargo.toml.
          python3 - <<'EOF'
          import hashlib, json, os
          import tomllib

          def cargo_version(path):
              with open(path, "rb") as f:
                  return tomllib.load(f)["package"]["version"]

          manifest = {
              "tag": os.environ.get("GITHUB_REF_NAME", ""),
              "git_sha": os.environ.get("GITHUB_SHA", ""),
              "server_package_version": cargo_version("sc-server/Cargo.toml"),
              "core_package_version": cargo_version("sc-core/Cargo.toml"),
              "artifacts": {},
          }
          for name in sorted(os.listdir("release-assets")):
              if name.endswith(".sha256"):
                  continue
              with open(f"release-assets/{name}", "rb") as f:
                  manifest["artifacts"][name] = hashlib.sha256(f.read()).hexdigest()
          with open("release-assets/release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          EOF

          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            release-assets/*
