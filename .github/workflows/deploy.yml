name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'sc-web/**'
      - 'docker/sc-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
    inputs:
      apply_phase4c_migration:
        description: 'Back up Postgres and remove the legacy cloud library after healthy deploy'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    # Self-hosted on the Vault (lngnckr.tech): GitHub-hosted runners cannot
    # reach the gateway's SSH port through the home firewall, but the Vault
    # is on a path that can. No PR context here (main push + dispatch only),
    # so no fork-guard expression is needed.
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: |
          WEB_VERSION=$(node -p "require('./sc-web/package.json').version")
          docker build \
            -f docker/sc-web/Dockerfile.prod \
            --build-arg GV_WEB_GIT_SHA="${{ github.sha }}" \
            --build-arg GV_WEB_VERSION="$WEB_VERSION" \
            --build-arg GV_WEB_RELEASED_AT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg NEXT_PUBLIC_POSTHOG_KEY="${{ secrets.POSTHOG_KEY }}" \
            --build-arg NEXT_PUBLIC_POSTHOG_HOST="${{ secrets.POSTHOG_HOST }}" \
            -t sc-web-prod:latest .

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          name: vps-key

      - name: Snapshot current web image (rollback point)
        run: |
          ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> '
            set -e
            if docker inspect sc-deploy-web-1 >/dev/null 2>&1; then
              OLD_IMAGE=$(docker inspect sc-deploy-web-1 --format "{{.Image}}")
              ROLLBACK_TAG="sc-web-prod:rollback-$(date -u +%Y%m%dT%H%M%SZ)"
              docker tag "$OLD_IMAGE" "$ROLLBACK_TAG"
              echo "✓ Snapshot: $ROLLBACK_TAG"
            else
              echo "No previous web container; skipping snapshot"
            fi
          '

      - name: Transfer image to VPS
        run: |
          docker save sc-web-prod:latest | gzip | \
            ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new \
              <vps-user>@<vps-host> 'gunzip | docker load'

      - name: Apply additive schema migrations
        run: |
          set -euo pipefail
          for migration in \
            sc-web/drizzle/0017_add_server_games.sql \
            sc-web/drizzle/0018_add_invite_codes.sql \
            sc-web/drizzle/0019_bind_short_codes_to_users.sql \
            sc-web/drizzle/0020_active_upgrade_guard.sql \
            sc-web/drizzle/0021_add_source_name.sql \
            sc-web/drizzle/0022_add_thumbnail_name.sql \
            sc-web/drizzle/0023_add_minted_via_proxy.sql \
            sc-web/drizzle/0024_add_verification_fields.sql \
            sc-web/drizzle/0025_add_game_flags.sql \
          ; do
            if [ ! -f "$migration" ]; then
              echo "  skip (not present): $migration"
              continue
            fi
            echo "  applying before web restart: $migration"
            scp -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new \
              "$migration" <vps-user>@<vps-host>:/tmp/migration.sql
            ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> "
              cd $VPS_DEPLOY_DIR
              PG_USER=\$(docker compose exec -T postgres printenv POSTGRES_USER)
              PG_DB=\$(docker compose exec -T postgres printenv POSTGRES_DB)
              docker compose exec -T postgres psql -U \"\$PG_USER\" -d \"\$PG_DB\" -v ON_ERROR_STOP=1 < /tmp/migration.sql
              rm -f /tmp/migration.sql
            "
            echo "  ✓ $migration"
          done

      - name: Restart sc-web on VPS
        run: |
          ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> '
            cd $VPS_DEPLOY_DIR && \
            docker compose up -d --no-deps --force-recreate web
          '

      - name: Health check (verifies deployed provenance == workflow SHA)
        run: |
          sleep 10
          HEALTH=""
          for i in $(seq 1 6); do
            if HEALTH=$(ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> \
              'cd $VPS_DEPLOY_DIR && docker compose exec -T web curl -fsS http://localhost:3000/api/health' 2>/dev/null); then
              echo "✓ Health endpoint responded"
              break
            fi
            echo "Waiting... ($i/6)"
            sleep 5
          done
          if [ -z "$HEALTH" ]; then
            echo "✗ Health check failed after 6 attempts"
            exit 1
          fi
          # Fail closed on provenance: the deployed image must report the
          # exact workflow SHA and a non-unknown version/timestamp (#661).
          EXPECTED_SHA="${{ github.sha }}"
          echo "$HEALTH" | grep -q "\"git_sha\":\"$EXPECTED_SHA\"" || {
            echo "✗ Provenance mismatch: expected web.git_sha=$EXPECTED_SHA"
            echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin)['versions']['web'])"
            exit 1
          }
          echo "$HEALTH" | grep -q '"package_version":"unknown"' && {
            echo "✗ Provenance missing: package_version is unknown"
            exit 1
          }
          echo "✓ Provenance verified: deployed SHA == workflow SHA"

      - name: Back up Postgres and apply Phase 4c migration
        if: github.event_name == 'workflow_dispatch' && inputs.apply_phase4c_migration
        run: |
          set -euo pipefail
          HEALTH_JSON=$(ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> \
            'cd $VPS_DEPLOY_DIR && docker compose exec -T web curl -fsS http://localhost:3000/api/health')
          grep -Eq '"phase4c_library_owner"[[:space:]]*:[[:space:]]*"sc-server"' <<<"$HEALTH_JSON"
          scp -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new \
            sc-web/drizzle/0016_remove_cloud_library.sql \
            <vps-user>@<vps-host>:/tmp/0016_remove_cloud_library.sql
          ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new <vps-user>@<vps-host> 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd $VPS_DEPLOY_DIR
          docker compose ps --status running postgres | grep -q postgres
          PG_USER=$(docker compose exec -T postgres printenv POSTGRES_USER)
          PG_DB=$(docker compose exec -T postgres printenv POSTGRES_DB)
          BACKUP_DIR=$VPS_DEPLOY_DIR/backups
          BACKUP_FILE="$BACKUP_DIR/pre-0016-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          mkdir -p "$BACKUP_DIR"
          docker compose exec -T postgres pg_dump -U "$PG_USER" "$PG_DB" | gzip -9 > "$BACKUP_FILE"
          test -s "$BACKUP_FILE"
          docker compose exec -T postgres psql -U "$PG_USER" -d "$PG_DB" -v ON_ERROR_STOP=1 \
            < /tmp/0016_remove_cloud_library.sql
          LEGACY_COUNT=$(docker compose exec -T postgres psql -U "$PG_USER" -d "$PG_DB" -Atc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('favorites','pinned_games','recent_plays','game_files','games','server_rom_roots');")
          test "$LEGACY_COUNT" = "0"
          rm -f /tmp/0016_remove_cloud_library.sql
          docker compose exec -T web curl -fsS http://localhost:3000/api/health >/dev/null
          printf 'Migration complete; backup: %s\n' "$BACKUP_FILE"
          REMOTE
